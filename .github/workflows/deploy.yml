# Construit et publie www.jugeote.fr sur GitHub Pages.
# Se lance à chaque modification, chaque jour à 7h (heure de Paris, hiver)
# pour récupérer les nouveaux épisodes, et à la demande (onglet Actions).
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
